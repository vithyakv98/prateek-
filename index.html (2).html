<style>
/* Layout: one centered column. A hero with a tappable cake, then a grid of envelopes that open into letters, the last one holding the vouchers. */
:root {
  --bg: #FFF0F5;
  --ink: #3A2A4D;
  --muted: #6F5C86;
  --pink: #FF8FB1;
  --pink-deep: #D9456F;
  --yellow: #FFD66B;
  --sky: #8ED1F0;
  --mint: #9FE3C8;
  --paper: #FFFFFF;
  --line: #F2CFDF;
  --shade: rgba(58, 42, 77, 0.55);
  --f-display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --f-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-hand: 'Caveat', 'Segoe Print', 'Bradley Hand', cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1D1430; --ink: #FBEFFF; --muted: #BBA8D6; --paper: #2B1F42; --line: #45336A; --shade: rgba(10, 5, 20, 0.7);
    --pink-deep: #FF8FB1; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D1430; --ink: #FBEFFF; --muted: #BBA8D6; --paper: #2B1F42; --line: #45336A; --shade: rgba(10, 5, 20, 0.7);
  --pink-deep: #FF8FB1; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.55;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 760px; margin: 0 auto; display: grid; gap: 40px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--pink-deep); outline-offset: 3px; border-radius: 10px; }

/* Hero */
.hero { display: grid; justify-items: center; gap: 12px; text-align: center; }
.hero h1 {
  font-family: var(--f-display); font-weight: 700; margin: 0;
  font-size: clamp(2rem, 8vw, 3.6rem); line-height: 1.1; text-wrap: balance; overflow-wrap: anywhere; max-width: 100%;
}
.hero h1 .name {
  background: linear-gradient(transparent 62%, var(--yellow) 62%, var(--yellow) 92%, transparent 92%);
  padding: 0 .12em;
}
.hero p { margin: 0; max-width: 34ch; color: var(--muted); font-size: 1.05rem; text-wrap: balance; }
.cake { background: none; border: 0; cursor: pointer; padding: 6px; width: min(260px, 70vw); }
.cake svg { width: 100%; height: auto; display: block; overflow: visible; }
.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.1s ease-in-out infinite alternate; }
.cake.out .flame { display: none; }
@keyframes flicker { from { transform: scale(1, 1) rotate(-3deg); } to { transform: scale(.92, 1.08) rotate(3deg); } }
.wish { font-family: var(--f-hand); font-size: 1.7rem; color: var(--pink-deep); min-height: 2.2rem; margin: 0; }

/* Envelope section */
.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.head h2 { font-family: var(--f-display); font-weight: 600; font-size: 1.5rem; margin: 0; }
.status { margin: 0; color: var(--muted); font-weight: 600; min-width: 0; }
.grid { list-style: none; margin: 18px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 26px 18px; }
.grid li { min-width: 0; }
.env { display: grid; gap: 10px; width: 100%; background: none; border: 0; padding: 0; cursor: pointer; text-align: center; }
.shape { position: relative; aspect-ratio: 4 / 3; perspective: 600px; transition: transform .2s ease; }
.env:hover .shape { transform: translateY(-4px) rotate(-1.5deg); }
.shape > * { position: absolute; }
.back { inset: 0; background: color-mix(in srgb, var(--c) 86%, #000); border-radius: 12px; z-index: 1; }
.peek {
  left: 9%; right: 9%; top: 10%; height: 72%; z-index: 2; border-radius: 6px; background: var(--paper);
  transition: transform .5s ease; box-shadow: 0 1px 0 var(--line);
  background-image: repeating-linear-gradient(transparent 0 9px, var(--line) 9px 10px);
  background-size: 70% 100%; background-repeat: no-repeat; background-position: 15% 14px;
}
.front { inset: 0; z-index: 3; background: var(--c); border-radius: 12px; clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%); }
.flap {
  left: 0; right: 0; top: 0; height: 55%; z-index: 4; background: color-mix(in srgb, var(--c) 78%, #000);
  clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top center; transition: transform .5s ease, z-index 0s .25s;
}
.seal { left: 50%; top: 55%; width: 34px; height: 34px; z-index: 5; transform: translate(-50%, -50%); transition: opacity .3s, transform .3s; filter: drop-shadow(0 2px 0 rgba(0,0,0,.18)); }
.seal svg { width: 100%; height: 100%; display: block; fill: var(--pink-deep); }
.env.opened .flap { transform: rotateX(180deg); z-index: 0; }
.env.opened .seal { opacity: 0; transform: translate(-50%, -50%) scale(.4); }
.env.opened .peek { transform: translateY(-34%); }
.tag { font-family: var(--f-display); font-weight: 600; font-size: .98rem; line-height: 1.2; text-wrap: balance; }
.env.opened .tag { color: var(--muted); font-weight: 400; }
.env.locked .shape { filter: saturate(.35) brightness(.96); }
.env.locked .seal svg { fill: var(--muted); }
.env.ready .shape { animation: wiggle .9s ease 2; }
.env.shake .shape { animation: shake .4s ease; }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* Letter overlay */
.overlay {
  position: fixed; inset: 0; z-index: 50; background: var(--shade); display: grid; place-items: center;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.letter {
  position: relative; width: min(540px, 100%); max-height: 100%; overflow-y: auto; background: var(--paper);
  border-radius: 18px; padding: 30px 26px 26px; box-shadow: 0 18px 50px rgba(0,0,0,.28);
  animation: rise .35s ease; border-top: 10px solid var(--c, var(--pink));
}
@keyframes rise { from { transform: translateY(26px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
.letter .kicker { margin: 0 0 4px; font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.letter h3 { font-family: var(--f-display); font-weight: 600; font-size: 1.6rem; line-height: 1.15; margin: 0 0 14px; text-wrap: balance; }
.letter .body { font-family: var(--f-hand); font-size: 1.55rem; line-height: 1.32; display: grid; gap: 10px; }
.letter .body p { margin: 0; }
.letter .sign { font-family: var(--f-hand); font-size: 1.6rem; color: var(--pink-deep); margin: 16px 0 0; }
.code { display: inline-block; font-family: var(--f-display); font-weight: 600; font-size: 1.3rem; letter-spacing: .06em; padding: 6px 16px; border: 2px dashed var(--pink); border-radius: 12px; background: color-mix(in srgb, var(--pink) 16%, var(--paper)); color: var(--pink-deep); overflow-wrap: anywhere; }
.close { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--line); cursor: pointer; font-size: 1.3rem; line-height: 1; }
.vouchers { margin-top: 22px; }
.vouchers h4 { font-family: var(--f-display); font-weight: 600; font-size: 1.1rem; margin: 0 0 10px; }
.vgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.voucher {
  position: relative; text-align: left; cursor: pointer; background: color-mix(in srgb, var(--pink) 16%, var(--paper));
  border: 2px dashed var(--pink); border-radius: 14px; padding: 12px 14px; min-width: 0; overflow: hidden;
}
.voucher b { display: block; font-family: var(--f-display); font-weight: 600; font-size: 1rem; line-height: 1.25; }
.voucher span { display: block; font-size: .85rem; color: var(--muted); margin-top: 2px; }
.voucher .stamp {
  position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700;
  font-size: 1.3rem; letter-spacing: .1em; color: var(--pink-deep); opacity: 0; transform: rotate(-12deg) scale(1.6);
  transition: opacity .2s, transform .25s; pointer-events: none;
}
.voucher.done > b, .voucher.done > span:not(.stamp) { opacity: .35; }
.voucher.done .stamp { opacity: 1; transform: rotate(-12deg) scale(1); border: 3px solid var(--pink-deep); border-radius: 10px; margin: 18% 12%; inset: 0; }

footer { text-align: center; color: var(--muted); font-family: var(--f-hand); font-size: 1.4rem; }
canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

@media (prefers-reduced-motion: reduce) {
  .flame, .env.ready .shape, .env.shake .shape, .letter { animation: none; }
  .shape, .peek, .flap, .seal, .voucher .stamp { transition: none; }
}
</style>

<main>
  <section class="hero">
    <button class="cake" id="cake" aria-label="Blow out the candle">
      <svg viewBox="0 0 220 200" role="img" aria-hidden="true">
        <ellipse cx="110" cy="180" rx="96" ry="12" fill="var(--sky)"/>
        <rect x="30" y="112" width="160" height="64" rx="14" fill="var(--pink)"/>
        <path d="M30 126 q0-14 14-14 h132 q14 0 14 14 q-10 14-20 0 q-10 14-20 0 q-10 14-20 0 q-10 14-20 0 q-10 14-20 0 q-10 14-20 0 q-10 14-20 0 q-10 14-20 0 z" fill="#fff"/>
        <rect x="62" y="76" width="96" height="40" rx="12" fill="var(--yellow)"/>
        <path d="M62 88 q0-12 12-12 h72 q12 0 12 12 q-8 12-16 0 q-8 12-16 0 q-8 12-16 0 q-8 12-16 0 q-8 12-16 0 q-8 12-16 0 z" fill="#fff"/>
        <circle cx="62" cy="152" r="4" fill="var(--yellow)"/><circle cx="96" cy="160" r="4" fill="var(--sky)"/>
        <circle cx="130" cy="150" r="4" fill="var(--mint)"/><circle cx="162" cy="160" r="4" fill="var(--yellow)"/>
        <rect x="104" y="42" width="12" height="36" rx="3" fill="var(--sky)"/>
        <rect x="104" y="52" width="12" height="4" fill="#fff" opacity=".7"/><rect x="104" y="64" width="12" height="4" fill="#fff" opacity=".7"/>
        <g class="flame">
          <path d="M110 16 C121 28 123 36 110 44 C97 36 99 28 110 16 Z" fill="#FFB020"/>
          <path d="M110 28 C115 33 116 38 110 42 C104 38 105 33 110 28 Z" fill="#FFE9A0"/>

    <p class="wish" id="wish" aria-live="polite">Tap the candle and make a wish</p>
    <h1>Happy Birthday, <span class="name" id="name">Superstar</span></h1>
    <p>I made you a tiny corner of the internet. Blow out the candle, then open every envelope.</p>
  </section>

  <section>
    <div class="head">

</main>

<div class="overlay" id="overlay" hidden>
  <article class="letter" id="letter" role="dialog" aria-modal="true" aria-labelledby="l-title">
    <button class="close" id="close" aria-label="Close letter">&times;</button>
    <p class="kicker" id="l-kicker"></p>

</div>

<script>
(function () {
  // Edit these two lines to personalise the page.
  var CONFIG = { name: 'Prateeeeeeeeeeeeek 😘😘', from: 'Vithya', sign: 'Adores and kisses you, Vithya' };

  var LETTERS = [
    { tag: 'Open first', title: 'Happy birthday, my love',
      body: ['My bestest wishes and lots of love, hugs, cuddles and kisses for you today.',
             'I hope this day turns out to be the best day, and that the whole universe aligns to get you everything you want.'] },
    { tag: 'Open when you are tired', title: 'It is okay to rest',
      body: ['It is okay to pause. It is okay to rest. You deserve it, always.',
             'I hope you remember how much I care for you and how much I like you, even when the world feels loud, heavy or too much. I am right here, on your side.'] },
    { tag: 'Open when you doubt yourself', title: 'A small reminder',
      body: ['You are more capable than your worst day makes you feel.',
             'Think of everything you have already figured out. This year will be no different, and I will be cheering the loudest.'] },
    { tag: 'Open when you miss me', title: 'We are never apart',
      body: ['Because you are always in my brain, in my heart and in my thoughts.',
             'Whenever you miss me, close your eyes and think of our beautiful moments together. I am already there.'] },
    { tag: 'Open if you are hungry', title: 'Tada! A coupon for you',
      body: ['You just won a coupon to eat me.',
             'You can dial in my number and I will be at your service. Just text the coupon code:',
             '<span class="code">eatmetoday</span>'] },
    { tag: 'Open at midnight', title: 'The cozy one',
      body: ['Hey you. It is late, the world has gone quiet, and I wish I could pull the blanket over you and hold you until you fall asleep.',
             'Let me be your cozy place tonight. Sleep well, my love. I will be dreaming of you.'] },
    { tag: 'Open last', title: 'The real reason for all this', final: true,
      body: ['Another year around the sun, and you keep getting better at being you.',
             'Dear Prateek, I really, really wish that this year and all the years to come, you get everything you want: all the love, money, luck and more. I wish you a very beautiful life filled with happy adventures and calm days.',
             'I am so glad you exist.',
             'Happy birthday, my sweetie pie, cupcake, munchkins, soona, jaanu and Prateeeeeeeeeeeeeeeek!'] }
  ];

  var VOUCHERS = [
    ['One long dinner, no phones', 'Your pick of place. I will not check my screen once.'],
    ['Movie night, your choice', 'No complaints. Maybe a few small ones.'],
    ['A very long hug', 'Expires never. Can be redeemed on bad days too.'],
    ['Sunset by the sea', 'Snacks are on me. Wind-blown hair included.']
  ];

  var COLORS = ['--pink', '--yellow', '--sky', '--mint'];
  var KEY = 'bday-envelopes-v1';
  var opened = [];
  var redeemed = [];
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (Array.isArray(saved.opened)) opened = saved.opened;
    if (Array.isArray(saved.redeemed)) redeemed = saved.redeemed;
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ opened: opened, redeemed: redeemed })); } catch (e) {} }

  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var statusEl = $('status'), grid = $('grid'), overlay = $('overlay');
  var lastFocus = null, statusTimer = null;
  var total = LETTERS.length;

  $('name').textContent = CONFIG.name;
  $('foot').textContent = 'Made with love by ' + CONFIG.from.toLowerCase().replace(/^./, function (c) { return c.toUpperCase(); }) + '.';

  var heart = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.6-9.3-9.1C1.3 8.9 3 5.5 6.2 5.2c2-.2 3.7.9 4.6 2.4.9-1.5 2.6-2.6 4.6-2.4 3.2.3 4.9 3.7 3.5 6.7C19 16.4 12 21 12 21z"/></svg>';

  function isLocked(i) { return LETTERS[i].final && opened.filter(function (n) { return n !== total - 1; }).length < total - 1; }

  function renderStatus(msg) {
    if (msg) { statusEl.textContent = msg; return; }
    var n = opened.length;
    if (n === 0) statusEl.textContent = 'Tap an envelope to open it';
    else if (n < total) statusEl.textContent = n + ' of ' + total + ' opened';
    else statusEl.textContent = 'All ' + total + ' opened. Happy birthday!';
  }

  LETTERS.forEach(function (L, i) {
    var li = document.createElement('li');
    var b = document.createElement('button');
    b.className = 'env'; b.type = 'button'; b.dataset.i = i;
    b.style.setProperty('--c', 'var(' + COLORS[i % COLORS.length] + ')');
    b.innerHTML = '<span class="shape"><span class="back"></span><span class="peek"></span><span class="front"></span><span class="flap"></span><span class="seal">' + heart + '</span></span><span class="tag">' + L.tag + '</span>';
    b.setAttribute('aria-label', L.tag);
    b.addEventListener('click', function () { openLetter(i, b); });
    li.appendChild(b); grid.appendChild(li);
  });
  var envs = grid.querySelectorAll('.env');

  function refresh() {
    envs.forEach(function (b, i) {
      b.classList.toggle('opened', opened.indexOf(i) > -1);
      var lock = isLocked(i);
      b.classList.toggle('locked', lock);
      b.setAttribute('aria-label', LETTERS[i].tag + (lock ? ', locked until the other six are opened' : ''));
    });
    renderStatus();
  }

  /* Letters */
  function openLetter(i, trigger) {
    var b = envs[i];
    if (isLocked(i)) {
      b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
      renderStatus('Open the other six first. Good things come to those who wait.');
      clearTimeout(statusTimer); statusTimer = setTimeout(function () { renderStatus(); }, 3200);
      return;
    }
    var L = LETTERS[i];
    lastFocus = trigger;
    $('letter').style.setProperty('--c', 'var(' + COLORS[i % COLORS.length] + ')');
    $('l-kicker').textContent = L.tag;
    $('l-title').textContent = L.title;
    $('l-body').innerHTML = L.body.map(function (p) { return '<p>' + p + '</p>'; }).join('');
    $('l-sign').textContent = L.final ? CONFIG.sign : '';
    $('l-vouch').hidden = !L.final;
    if (L.final) buildVouchers();
    overlay.hidden = false;
    $('letter').scrollTop = 0;
    $('close').focus();
    var first = opened.indexOf(i) === -1;
    if (first) {
      opened.push(i); save();
      var restOpen = opened.filter(function (n) { return n !== total - 1; }).length;
      if (!L.final && restOpen === total - 1) {
        envs[total - 1].classList.add('ready');
        setTimeout(function () { burst(window.innerWidth / 2, window.innerHeight / 3, 70); }, 350);
      }
      if (L.final) setTimeout(function () { burst(window.innerWidth / 2, window.innerHeight / 3, 110); }, 400);
    }
    refresh();
  }
  function closeLetter() {
    overlay.hidden = true;
    if (lastFocus) lastFocus.focus();
  }
  $('close').addEventListener('click', closeLetter);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeLetter(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !overlay.hidden) closeLetter(); });

  function buildVouchers() {
    var g = $('vgrid'); g.innerHTML = '';
    VOUCHERS.forEach(function (v, k) {
      var t = document.createElement('button');
      t.type = 'button'; t.className = 'voucher' + (redeemed.indexOf(k) > -1 ? ' done' : '');
      t.setAttribute('aria-pressed', redeemed.indexOf(k) > -1 ? 'true' : 'false');
      t.innerHTML = '<b>' + v[0] + '</b><span>' + v[1] + '</span><span class="stamp">REDEEMED</span>';
      t.addEventListener('click', function () {
        var at = redeemed.indexOf(k);
        if (at > -1) redeemed.splice(at, 1); else redeemed.push(k);
        t.classList.toggle('done', at === -1);
        t.setAttribute('aria-pressed', at === -1 ? 'true' : 'false');
        save();
        if (at === -1) { var r = t.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 24); }
      });
      g.appendChild(t);
    });
  }

  /* Cake */
  var cake = $('cake');
  cake.addEventListener('click', function () {
    var out = cake.classList.toggle('out');
    $('wish').textContent = out ? 'Wish made. Now open your envelopes.' : 'Tap the candle and make a wish';
    if (out) { var r = cake.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height * 0.3, 60); }
  });

  /* Confetti */
  var cv = $('fx'), ctx = cv.getContext('2d'), parts = [], raf = null;
  function size() { cv.width = window.innerWidth * (window.devicePixelRatio || 1); cv.height = window.innerHeight * (window.devicePixelRatio || 1); }
  size(); window.addEventListener('resize', size);
  function palette() {
    var s = getComputedStyle(document.documentElement);
    return ['--pink', '--yellow', '--sky', '--mint'].map(function (n) { return s.getPropertyValue(n).trim() || '#FF8FB1'; });
  }
  function burst(x, y, n) {
    if (reduce) return;
    var cols = palette(), dpr = window.devicePixelRatio || 1;
    for (var k = 0; k < n; k++) {
      var a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 7;
      parts.push({ x: x * dpr, y: y * dpr, vx: Math.cos(a) * sp * dpr, vy: (Math.sin(a) * sp - 4) * dpr,
        w: (6 + Math.random() * 6) * dpr, h: (4 + Math.random() * 5) * dpr, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
        c: cols[k % cols.length], life: 90 + Math.random() * 50 });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    var g = 0.22 * (window.devicePixelRatio || 1);
    parts = parts.filter(function (p) { return p.life > 0 && p.y < cv.height + 40; });
    parts.forEach(function (p) {
      p.vy += g; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.min(1, p.life / 30);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    });
    raf = parts.length ? requestAnimationFrame(tick) : null;
    if (!parts.length) ctx.clearRect(0, 0, cv.width, cv.height);
  }

  refresh();
})();
</script>
